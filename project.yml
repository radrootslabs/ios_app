name: Radroots

options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

packages:
  RadrootsKit:
    url: https://github.com/radrootslabs/apple_kit.git
    revision: 265015fc537bfe507f12d801b9765be9764fbc95

targets:
  RadrootsKitBindings:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Radroots/Generated/RadrootsKitBindings.swift
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.radroots.RadrootsKitBindings
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - framework: Radroots/Frameworks/RadrootsFFI.xcframework
        embed: false
  Radroots:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Radroots/App/App.swift
      - path: Radroots/App/AppEntry.swift
      - path: Radroots/App/RadrootsAppModel.swift
      - path: Radroots/App/RadrootsProvider.swift
      - path: Radroots/App/RadrootsRootShell.swift
      - path: Radroots/Runtime/RadrootsGeneratedRuntimeBackend.swift
      - path: Radroots/Runtime/RadrootsRuntimeClient.swift
      - path: Radroots/Runtime/RadrootsRuntimeModels.swift
      - path: Radroots/State/RadrootsConfigurationStore.swift
      - path: Radroots/State/RadrootsIdentityStore.swift
      - path: Radroots/State/RadrootsSessionStore.swift
      - path: Radroots/State/RadrootsTodayStore.swift
      - path: Radroots/Views/RadrootsTodayView.swift
      - path: Radroots/Views/RuntimeStatusView.swift
      - path: Radroots/Resources
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Radroots/Info.plist
    configFiles:
      Debug: Radroots/Config/Debug.xcconfig
      Release: Radroots/Config/Release.xcconfig
    dependencies:
      - target: RadrootsKitBindings
        embed: true
      - package: RadrootsKit
    preBuildScripts:
      - name: Generate git SHA xcconfig
        basedOnDependencyAnalysis: false
        script: |
          GIT_SHA=$(git rev-parse --short HEAD || echo "unknown")
          echo "GIT_SHA = $GIT_SHA" > "$SRCROOT/Radroots/radroots.git.xcconfig"
  RadrootsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RadrootsTests/RadrootsRuntimeClientTests.swift
      - path: RadrootsTests/RadrootsRootShellTests.swift
      - path: RadrootsTests/RadrootsStateMigrationTests.swift
      - path: RadrootsTests/RadrootsTodayStoreTests.swift
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Radroots
  RadrootsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RadrootsUITests/RadrootsRootShellUITests.swift
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Radroots
schemes:
  Radroots:
    build:
      targets:
        Radroots: all
    test:
      targets:
        - RadrootsTests
        - RadrootsUITests
