name: Radroots

options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

packages:
  RadrootsKit:
    url: https://github.com/radrootslabs/apple_kit.git
    revision: fdcf377466e1c25945ef561042ebc250eb68cd3a

targets:
  Radroots:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Radroots
        excludes:
          - Info.plist
          - Frameworks
    settings:
      base:
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Radroots/Info.plist
    configFiles:
      Debug: Radroots/Config/Debug.xcconfig
      Release: Radroots/Config/Release.xcconfig
    dependencies:
      - framework: Radroots/Frameworks/RadrootsFFI.xcframework
        embed: false
      - package: RadrootsKit
    preBuildScripts:
      - name: Generate git SHA xcconfig
        basedOnDependencyAnalysis: false
        script: |
          GIT_SHA=$(git rev-parse --short HEAD || echo "unknown")
          echo "GIT_SHA = $GIT_SHA" > "$SRCROOT/Radroots/radroots.git.xcconfig"
  RadrootsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RadrootsTests
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Radroots
schemes:
  Radroots:
    build:
      targets:
        Radroots: all
    test:
      targets:
        - RadrootsTests
